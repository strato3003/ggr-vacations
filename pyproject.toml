[project]
name = "ggr-vacations"
version = "0.1.6"
description = "Enregistrement des vacations HF F6KUF / flotte Golden Globe Race"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GGR Vacations" }]
dependencies = [
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "playwright==1.50.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
ggr-vacations = "app.main:run"
ggr-record = "recorder.session:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "recorder*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*", "static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
