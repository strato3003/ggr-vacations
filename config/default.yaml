# Configuration GGR Vacations — F6KUF / flotte Golden Globe Race
version: "0.1.9"

club:
  callsign: F6KUF
  name: "Radio-club F6KUF"

# Vacation quotidienne
schedule:
  # Heure TU du bulletin météo
  time_utc: "18:00"
  # Démarrer 1 min avant 18:00 TU (fenêtre 17:59–18:09 TU si durée 10 min).
  lead_minutes: 1
  # Durée d’enregistrement bulletin + ACK en parallèle (ajustable dans Réglages)
  duration_minutes: 10

radio:
  mode: usb
  usb_filter:
    low_hz: 300
    high_hz: 2700
  tx:
    freq_khz: 14135.0
    # Le club peut être à ± 5 kHz de la QRG nominale (QRM / QSY)
    qrg_tolerance_khz: 5.0
    label: "Bulletin météo F6KUF"
    zoom: 10
  ack:
    - freq_khz: 16551.5
      label: "Accusé 16,5515 MHz"
      zoom: 10
    - freq_khz: 12418.5
      label: "Accusé 12,4185 MHz"
      zoom: 10

# Position moyenne de la flotte GGR (Yellowbrick)
fleet:
  source: yellowbrick
  race_id: ggr2026
  tracker_host: cf.yb.tl
  # Ignorer les traces « fantômes » historiques (Moitessier, RKJ, etc.)
  skip_team_id_from: 900
  # Repli si le tracker est indisponible (Les Sables-d'Olonne)
  fallback:
    lat: 46.5025
    lon: -1.7888
    label: "Les Sables-d'Olonne (repli)"

sdr:
  # Liste publique KiwiSDR (JS, virgules finales possibles)
  directory_url: "http://rx.linkfanel.net/kiwisdr_com.js"
  ident_user: ggr-vacations
  # Places libres minimales pour le screencast TX (navigateur = 1 slot).
  # Les ACK n’ont besoin que d’un flux SND (1 place).
  min_free_slots: 2
  # Couverture HF nécessaire (Hz)
  min_freq_hz: 12000000
  max_freq_hz: 17000000
  screencast_tx: true
  screencast_ack: false
  viewport:
    width: 1280
    height: 800
  # Écoute ACK en parallèle : un Kiwi distinct par site (rayon max autour du point).
  sites:
    france:
      # Les Sables-d'Olonne / F6KUF (WGS84)
      lat: 46.5025
      lon: -1.7888
      label: France
      radius_km: 1500
    tahiti:
      # Papeete 17°32′6″S 149°34′11″W (relais quand la flotte est dans l’océan Indien)
      lat: -17.5350
      lon: -149.5697
      label: Tahiti
      radius_km: 2500

storage:
  data_dir: /data
  # PVC 5 Gio : 10 min (screencast + bulletin + 2 QRG × 3 sites) ≈ 150–220 Mio → ~14 jours
  retention_days: 14

web:
  title: "GGR Vacations"
  host: "0.0.0.0"
  port: 8080
  # Jeton pour déclencher un enregistrement manuel (POST /api/vacations/record)
  admin_token: ""

# Hôte Ingress Traefik + Let's Encrypt
ingress:
  host: ggr-vacations.k3s.lpb.ovh
