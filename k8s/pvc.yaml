apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ggr-vacations-data
  labels:
    app.kubernetes.io/name: ggr-vacations
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # VPS ~72 Go dont ~26 Go libres : rester très en dessous du disque racine.
      storage: 5Gi
  # Sur k3s : storageClass local-path (défaut, consomme /). Adapter si besoin.
  storageClassName: local-path
